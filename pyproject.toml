[project]
name = "libtcod-roguelike"
version = "0.1.0"
description = "A simple ASCII roguelike game built with Python and libtcod"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "tcod>=16.0.0",
    "numpy>=1.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.uv]
dev-dependencies = []
